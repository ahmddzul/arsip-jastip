<!doctype html>
<html lang="id" data-theme="ungu" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arsip Jastip</title>
  <meta name="description" content="Arsip Jastip: catat PO, list pelanggan, bagi jatah, tagihan, dan kiriman jastip dari HP.">
  <meta name="theme-color" content="#F7F7F9">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('aj_theme') || 'ungu', m = localStorage.getItem('aj_mode') || 'auto';
        if (m === 'auto') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t; document.documentElement.dataset.mode = m;
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Arsip Jastip">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="bnav" class="bnav" aria-label="Navigasi utama"></nav>
  </div>
  <div id="sheets"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="splash" role="status" hidden></div>

  <script src="js/ui.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/demo.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/sheets.js" defer></script>
  <script src="js/faq.js" defer></script>
  <script src="js/quotes.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
